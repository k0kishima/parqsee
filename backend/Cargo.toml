[package]
name = "parqsee"
version = "1.0.0"
description = "A fast and simple Parquet file viewer for macOS"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "parqsee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Links the StoreKit 2 bridge (`storekit/`, built by `build.rs`) and reads
# the trial / purchase state from the App Store. Off by default: the e2e
# bridge, `cargo test --lib`, `pnpm tauri dev` and non-macOS builds run
# without it and are always unlocked (see `services::store`).
app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = "58"
arrow = "58"
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3"
tauri-plugin-dialog = "2.3.2"
tauri-plugin-notification = "2"
url = "2"
datafusion = { version = "54.0.0", default-features = false, features = [
    "parquet",
    "sql",
    "recursive_protection",
    # Function families the SQL view is expected to have; `encode()` also
    # backs the filter bar's binary comparisons.
    "nested_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "math_expressions",
    "crypto_expressions",
] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
base64 = "0.22"

# Security-scoped bookmarks (services/access/macos.rs). Same versions tauri
# already pulls in, so this adds no new crates to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    # The language the menu starts in (`menu::system_language`).
    "NSLocale",
    "NSString",
    "NSURL",
] }

